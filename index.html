<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Work Tasks</title>

        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h1>Work Tasks</h1>
        <p class="description highlight">Keep track of ongoing tasks and their progress</p>

        <form>
            <label for="task-title">Task Title:</label>
            <input type="text" id="task-title" name="task-title" placeholder="Enter a new task">
            <button type="submit">Add Task</button>
        </form>

        <h2>Tasks</h2>
        <ul>
            <li>
                <input type="checkbox" id="upload-youzan">
                <label for="upload-youzan">Upload products to YouZan</label>
            </li>
            <li>
                <input type="checkbox" id="wrap-up-youzan">
                <label for="wrap-up-youzan">Wrap up YouZan lucky bag expander</label>
            </li>
            <li>
                <input type="checkbox" id="file-management">
                <label for="file-management">File management with Copilot</label>
            </li>
        </ul>
    </body>
</html>
