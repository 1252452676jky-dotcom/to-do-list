<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Tasks</title>

  <link rel="stylesheet" href="styles.css">
  <!-- "defer": download now, but run only after the whole page is parsed,
       so app.js can safely find the elements below. -->
  <script src="app.js" defer></script>
</head>

<!-- STRUCTURE ONLY. Styling lives in styles.css; behavior lives in app.js.
     The task lists below start empty: app.js fills each <ul> with <li> items. -->
<body>
  <main class="app">

    <header class="app-header">
      <h1>Work Tasks</h1>
      <p class="description">Keep track of ongoing tasks and their progress.</p>
      <!-- role="status": screen readers announce changes to this line politely -->
      <p class="summary" id="summary" role="status"></p>
    </header>

    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a task</h2>

      <form class="add-form" id="add-form">
        <div class="field field-wide">
          <label for="task-title">Task title</label>
          <input type="text" id="task-title" name="task-title"
                 maxlength="120" autocomplete="off"
                 placeholder="What needs to be done?"
                 aria-describedby="form-error">
        </div>

        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority" name="task-priority">
            <option value="high">High</option>
            <option value="normal" selected>Normal</option>
            <option value="low">Low</option>
          </select>
        </div>

        <div class="field">
          <label for="task-due">Due date <span class="optional">(optional)</span></label>
          <input type="date" id="task-due" name="task-due">
        </div>

        <div class="field field-wide">
          <label for="task-note">Note <span class="optional">(optional)</span></label>
          <input type="text" id="task-note" name="task-note"
                 maxlength="300" autocomplete="off">
        </div>

        <!-- Shown by app.js when the title is empty. role="alert" announces it. -->
        <p class="form-error field-wide" id="form-error" role="alert" hidden></p>

        <button type="submit" class="btn-primary field-wide">Add task</button>
      </form>
    </section>

    <section class="task-section" aria-labelledby="active-heading">
      <h2 id="active-heading">Active <span class="count" id="active-count">0</span></h2>
      <p class="empty" id="active-empty">Nothing on the board. Add a task above.</p>
      <ul class="task-list" id="active-list"></ul>
    </section>

    <!-- <details> is a native show/hide widget: keyboard-accessible with no JS. -->
    <details class="task-section fold">
      <summary>Low priority <span class="count" id="low-count">0</span></summary>
      <p class="empty" id="low-empty">No low-priority tasks.</p>
      <ul class="task-list" id="low-list"></ul>
    </details>

    <details class="task-section fold">
      <summary>Completed <span class="count" id="done-count">0</span></summary>
      <p class="empty" id="done-empty">Nothing completed yet.</p>
      <ul class="task-list" id="done-list"></ul>
    </details>

  </main>
</body>
</html>
